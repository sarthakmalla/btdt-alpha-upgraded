<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BTDT iOS 27 Phone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Crimson+Pro:wght@500;600;700&family=EB+Garamond:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Libre+Baskerville:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./vendor/f7/framework7-bundle.min.css" />
  <link rel="stylesheet" href="./vendor/f7/framework7-icons.css" />
  <style>
    :root {
      --f7-theme-color: #f64838;
      --f7-theme-color-rgb: 246, 72, 56;
      --f7-theme-color-shade: #d93526;
      --f7-theme-color-tint: #ff695b;
      --f7-font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;

      /* BTDT Crimzon Brand Tokens */
      --btdt-bg: #050101;
      --btdt-accent: #f64838;
      --btdt-display: 'Space Grotesk', sans-serif;
      --btdt-body: 'Plus Jakarta Sans', sans-serif;
      --btdt-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: var(--f7-font-family);
      user-select: none;
    }

    /* Authentic iOS 27 Top Status Bar (Matches Figma node 2971:29538 exact dimensions) */
    .ios-statusbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 62px;
      padding: 3px 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9500;
      pointer-events: none;
      color: #ffffff;
      transition: color 0.2s ease, filter 0.2s ease;
    }
    .ios-statusbar.dark-text {
      color: #000000;
    }
    .ios-statusbar.dark-text .ios-bar-pill { background: #000000; }
    .ios-statusbar.dark-text .ios-status-svg { filter: invert(1); }

    .ios-time-wrap {
      flex: 1 0 0;
      height: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 10px;
    }
    .ios-time {
      font-size: 17.5px;
      font-weight: 600;
      line-height: 22px;
      letter-spacing: -0.02em;
    }
    .ios-di-capsule {
      position: fixed;
      top: 14.67px;
      left: 50%;
      transform: translate3d(-50%, 0, 0);
      width: 94px;
      height: 35.67px;
      border-radius: 100px;
      background: transparent;
      z-index: 9600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 11px;
      cursor: pointer;
      pointer-events: auto;
      overflow: hidden;
      will-change: transform, width, opacity, background-color;
      transition: width 0.36s cubic-bezier(0.22, 1, 0.36, 1), transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.22s ease, box-shadow 0.32s ease, border-color 0.32s ease;
      border: 0.75px solid transparent;
    }
    .ios-di-capsule:active {
      transform: translate3d(-50%, 0, 0) scale(0.96);
    }
    .ios-di-capsule.expanded {
      width: 244px;
      height: 35.67px;
      padding: 0 12px;
      background: #000000;
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(246, 72, 56, 0.38);
    }
    .ios-statusbar.di-expanded .ios-time-wrap,
    .ios-statusbar.di-expanded .ios-levels-wrap {
      opacity: 0;
      transition: opacity 0.16s ease;
    }
    .ios-di-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.2s ease, transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .ios-di-capsule.expanded .ios-di-content {
      opacity: 1;
      transform: scale(1);
    }
    .ios-di-spacer {
      width: 100px;
      height: 36px;
      flex-shrink: 0;
    }
    .ios-levels-wrap {
      flex: 1 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding-right: 10px;
    }
    .ios-cell-bars {
      display: flex;
      align-items: flex-end;
      gap: 2.33px;
      padding-top: 1.33px;
    }
    .ios-bar-pill {
      width: 3.33px;
      border-radius: 4px;
      background: #ffffff;
    }

    /* Authentic iOS Home Bar Indicator */
    .ios-home-indicator-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 24px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      z-index: 9500;
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    .ios-home-pill {
      width: 144px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      transition: transform 0.14s ease;
    }
    .ios-home-indicator-wrap.dark-bar .ios-home-pill {
      background: rgba(0, 0, 0, 0.8);
      box-shadow: none;
    }
    .ios-home-indicator-wrap:active .ios-home-pill { transform: scaleX(0.92); }

    /* Apple 0.5s Power-On Boot Screen */
    .apple-boot {
      position: fixed;
      inset: 0;
      z-index: 9900;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      pointer-events: auto;
      will-change: opacity, transform;
      transition: opacity 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .apple-boot.done {
      opacity: 0;
      pointer-events: none;
    }

    /* Interactive iOS 27 Lock Screen (440x956 Pro Max, 144Hz GPU swipe-up) */
    .ios-lockscreen {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: #141210 url('./media/ios27/wallpaper_default.png') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 74px 24px 18px;
      color: #ffffff;
      touch-action: none;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0) scale(1);
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.26s ease;
    }
    .ios-lockscreen.dark-wallpaper {
      background-image: url('./media/ios27/wallpaper_dark.png');
    }
    .ios-lockscreen.dragging {
      transition: none !important;
    }
    .ios-lockscreen.unlocked {
      transform: translate3d(0, -104%, 0) scale(0.96);
      opacity: 0;
      pointer-events: none;
    }
    .ls-torch-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 85%, rgba(255, 240, 200, 0.36), transparent 60%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .ls-torch-glow.on { opacity: 1; }
    .ls-clock-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 8px;
    }
    .ls-padlock {
      font-size: 16px;
      margin-bottom: 6px;
      opacity: 0.92;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ls-date {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
    }
    .ls-time {
      font-size: 102px;
      font-weight: 700;
      line-height: 0.96;
      letter-spacing: -0.04em;
      margin-top: 4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.58) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.42);
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.28));
    }
    .ls-widgets {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 14px;
      padding: 8px 16px;
      border-radius: 22px;
      background: rgba(20, 20, 24, 0.28);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 0.75px solid rgba(255, 255, 255, 0.24);
    }
    .ls-notif-card {
      width: 100%;
      padding: 13px 15px;
      border-radius: 24px;
      background: rgba(22, 16, 16, 0.56);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 0.75px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .ls-bottom-row {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 12px 16px;
    }
    .ls-quick-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 0.75px solid rgba(255, 255, 255, 0.34);
      background: rgba(30, 30, 34, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease;
    }
    .ls-quick-btn:active { transform: scale(0.88); }
    .ls-quick-btn.active { background: rgba(255, 255, 255, 0.88); color: #111; }
    .ls-swipe-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 6px 14px;
    }
    .ls-swipe-label {
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.86);
      text-shadow: 0 1px 8px rgba(0,0,0,0.45);
      animation: swipeFloat 1.8s ease-in-out infinite;
    }
    @keyframes swipeFloat {
      0%, 100% { transform: translate3d(0, 0, 0); opacity: 0.82; }
      50%      { transform: translate3d(0, -4px, 0); opacity: 1; }
    }

    /* iOS 27 SpringBoard Home Screen (iPhone 18 Pro Max 440x956) */
    .springboard {
      position: fixed;
      inset: 0;
      background: #1a1816 url('./media/ios27/wallpaper_default.png') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 66px;
      z-index: 100;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0) scale(1);
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), transform 0.34s cubic-bezier(0.16, 1, 0.3, 1), background-image 0.25s ease;
    }
    .springboard.dark-wallpaper {
      background-image: url('./media/ios27/wallpaper_dark.png');
    }
    .springboard.locked-behind {
      transform: translate3d(0, 0, 0) scale(0.94);
    }
    .springboard.hidden-os {
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, 0, 0) scale(1.06);
    }

    .os-icons-canvas {
      flex: 1 0 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 22px 32px 0;
      min-height: 0;
    }
    .os-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      width: 100%;
    }
    .os-slot-empty {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
    }
    .os-app-btn {
      width: 68px;
      background: none;
      border: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .os-app-btn:active .os-icon-frame {
      transform: scale(0.89);
      filter: brightness(0.84);
    }
    .os-icon-frame {
      width: 68px;
      height: 68px;
      position: relative;
      will-change: transform;
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), filter 0.16s ease;
    }
    .os-icon-img {
      width: 68px;
      height: 68px;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .os-btdt-icon {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: linear-gradient(155deg, #f64838 0%, #a5160e 55%, #190505 100%);
      border: 0.75px solid rgba(255,255,255,0.34);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.42);
    }
    .os-btdt-label {
      font-family: var(--btdt-display);
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #fff;
      line-height: 1;
      margin-top: 2px;
    }
    .os-app-label {
      width: 78px;
      height: 14px;
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      text-align: center;
      text-shadow: 0px 2px 14px rgba(0,0,0,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 14px;
    }
    .ios-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 100px;
      background: #ff383c;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      z-index: 2;
    }

    /* Exact iOS 27 Liquid Glass Search Field + Dock from Figma */
    .ios27-search {
      width: auto !important;
      flex: 0 0 auto;
      height: 30px;
      padding: 7px 14px;
      border-radius: 100px;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      font-size: 11.5px;
      font-weight: 600;
      border: 0;
      cursor: pointer;
      background: rgba(153, 153, 153, 0.33);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 1.25px 0px 0px -0.75px rgba(255,255,255,0.55), -1.25px 0px 0px -0.75px rgba(255,255,255,0.55), 0px 0px 0px 0.5px rgba(255,255,255,0.45), 0px 8px 15px 0px rgba(0,0,0,0.12);
    }
    .ios27-dock-wrap {
      width: 100%;
      padding: 12px 18px 30px;
      flex-shrink: 0;
    }
    .ios27-dock {
      width: 100%;
      padding: 16px 20px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(153, 153, 153, 0.33);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 1.25px 0px 0px -0.75px rgba(255,255,255,0.6), -1.25px 0px 0px -0.75px rgba(255,255,255,0.6), 0px 0px 0px 0.5px rgba(255,255,255,0.45), 0px 10px 24px 0px rgba(0,0,0,0.18);
    }

    /* Active App Layer (144Hz GPU Spring Launch) */
    .active-app-shell {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #000;
      display: none;
      flex-direction: column;
      will-change: transform, opacity;
    }
    .active-app-shell.visible {
      display: flex;
      animation: iosAppLaunch 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes iosAppLaunch {
      from { opacity: 0.35; transform: translate3d(0, 12px, 0) scale(0.91); border-radius: 44px; }
      to   { opacity: 1;    transform: translate3d(0, 0, 0)    scale(1);    border-radius: 0; }
    }

    /* Apple Calculator View */
    .calc-view {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 68px 18px 36px;
      color: #fff;
    }
    .calc-top-bar {
      position: absolute;
      top: 66px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .calc-display-wrap { padding: 0 8px 16px; text-align: right; }
    .calc-expr { font-size: 18px; color: rgba(255,255,255,0.45); min-height: 24px; }
    .calc-val { font-size: 68px; font-weight: 300; letter-spacing: -0.03em; line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .calc-btn {
      height: 76px; border-radius: 999px; border: 0; font-size: 29px; color: #fff; background: #333; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .calc-btn:active { filter: brightness(1.3); }
    .calc-btn.fn { background: #a5a5a5; color: #000; font-size: 24px; font-weight: 500; }
    .calc-btn.op { background: #ff9f0a; color: #fff; font-size: 31px; font-weight: 500; }
    .calc-btn.zero { grid-column: span 2; justify-content: flex-start; padding-left: 32px; }

    /* Framework7 View & Status Bar Clearance */
    #app, .view, .page { width: 100%; height: 100%; margin: 0; }
    .page-content { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .ios .navbar { height: 104px !important; }
    .ios .navbar-inner { top: 58px !important; height: 46px !important; align-items: center !important; }
    .ios .navbar ~ .page-content { padding-top: 106px !important; }
    .ios .toolbar-bottom { padding-bottom: 20px !important; height: 78px !important; }
    .ios .toolbar-bottom ~ .page-content { padding-bottom: 86px !important; }

    /* BTDT Native Apple iOS 18 Cupertino Dark Theme */
    .btdt-app-page {
      background: #000000 !important;
      color: #ffffff !important;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", -apple-system-subheadline, "Helvetica Neue", Arial, sans-serif !important;
      letter-spacing: -0.015em;
    }
    .btdt-app-page .navbar-bg {
      background: rgba(28, 28, 30, 0.82) !important;
      backdrop-filter: blur(25px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(25px) saturate(180%) !important;
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.12) !important;
    }
    .btdt-app-page .navbar-inner,
    .btdt-app-page .navbar .title {
      color: #ffffff !important;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .btdt-app-page .navbar .link {
      color: #f64838 !important;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 14px;
      font-weight: 500;
    }
    .btdt-app-page .toolbar-bottom {
      background: rgba(28, 28, 30, 0.88) !important;
      backdrop-filter: blur(25px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(25px) saturate(180%) !important;
      border-top: 0.5px solid rgba(255, 255, 255, 0.14) !important;
    }
    .btdt-app-page .toolbar-bottom .tab-link {
      color: rgba(255, 255, 255, 0.45) !important;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 10px;
      font-weight: 500;
    }
    .btdt-app-page .toolbar-bottom .tab-link-active {
      color: #f64838 !important;
      font-weight: 600;
    }
    .btdt-app-page .page-content {
      padding-left: 16px;
      padding-right: 16px;
      background: #000000;
    }

    .btdt-h2 {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin: 0;
      line-height: 1.18;
      animation: appCardFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes appCardFade {
      from { opacity: 0; transform: translate3d(0, 8px, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    .btdt-mono { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 10.5px; letter-spacing: 0.04em; }
    
    /* Authentic Cupertino Segmented Control */
    .ios-role-pill {
      display: inline-flex;
      background: rgba(118, 118, 128, 0.28);
      border-radius: 8.9px;
      padding: 2px;
      gap: 2px;
    }
    .ios-role-pill button {
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 14px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ios-role-pill button.active {
      background: #636366;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35), 0 1px 1px rgba(0, 0, 0, 0.2);
    }

    /* Apple Grouped Inset Cards */
    .btdt-card {
      border-radius: 14px;
      border: 0.5px solid rgba(255, 255, 255, 0.1);
      background: #1c1c1e;
      padding: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }
    .btdt-card-accent {
      border-radius: 16px;
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      background: #1c1c1e;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      padding: 16px;
      position: relative;
    }
    .btdt-pill {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px;
      border-radius: 6px; border: 0.5px solid rgba(246, 72, 56, 0.45);
      background: rgba(246, 72, 56, 0.14); color: #ff7e72;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase;
      white-space: nowrap; flex-shrink: 0;
    }
    .btdt-pill-green { border-color: rgba(74, 222, 128, 0.35); background: rgba(34, 197, 94, 0.14); color: #4ade80; }
    
    /* Apple Native Buttons with Tactile Spring Feel */
    .btdt-btn-fill {
      width: 100%; padding: 11px 16px; border-radius: 12px; border: 0;
      background: #f64838; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 13.5px; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 14px rgba(246, 72, 56, 0.35);
      transition: transform 0.12s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.12s ease;
    }
    .btdt-btn-fill:active { transform: scale(0.97); opacity: 0.9; }
    .btdt-btn-outline {
      width: 100%; padding: 10px 16px; border-radius: 12px;
      border: 0.5px solid rgba(255, 255, 255, 0.18);
      background: #2c2c2e; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: transform 0.12s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btdt-btn-outline:active { transform: scale(0.97); }

    .btdt-input, .btdt-select {
      width: 100%; margin-top: 5px; padding: 11px 12px; border-radius: 10px;
      border: 0.5px solid rgba(255, 255, 255, 0.16); background: #2c2c2e;
      color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 14px; outline: none;
    }
    .btdt-input:focus, .btdt-select:focus { border-color: #f64838; background: #3a3a3c; }
    .btdt-seg {
      display: grid; grid-template-columns: 1fr 1fr; padding: 3px;
      border-radius: 9px; border: 0.5px solid rgba(255, 255, 255, 0.1);
      background: rgba(118, 118, 128, 0.24); gap: 2px;
    }
    .btdt-seg button {
      border: 0; padding: 7px; border-radius: 7px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 13px; font-weight: 500;
      cursor: pointer; color: rgba(255, 255, 255, 0.65); background: transparent;
      transition: all 0.18s ease;
    }
    .btdt-seg button.active { background: #636366; color: #ffffff; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }

    /* BTDT Splash Screen */
    .btdt-splash {
      position: fixed; inset: 0; z-index: 4000;
      background: radial-gradient(circle at 50% 35%, rgba(246,72,56,0.28) 0%, #160606 46%, #050101 100%);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; text-align: center; padding: 32px; cursor: pointer;
    }
    .btdt-splash.visible { display: flex; animation: fadeSplash 0.2s ease; }
    @keyframes fadeSplash { from { opacity: 0.2; } to { opacity: 1; } }
    .btdt-splash-mark {
      width: 86px; height: 86px; border-radius: 22px;
      background: linear-gradient(155deg, #f64838 0%, #99170f 70%, #2b0605 100%);
      border: 1px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 20px 55px rgba(246,72,56,0.45); margin-bottom: 18px;
    }
    .uni-logo-pill {
      height: 28px; max-width: 72px; background: transparent;
      padding: 0; object-fit: contain;
      display: inline-block; vertical-align: middle;
      filter: drop-shadow(0 1px 4px rgba(255,255,255,0.14));
    }
    .btdt-chat-stream {
      display: flex;
      flex-direction: column;
      padding: 4px 0;
    }
    .btdt-msg {
      width: fit-content;
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 13.5px;
      line-height: 1.38;
      margin-bottom: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      word-break: break-word;
      overflow-wrap: anywhere;
      animation: msgPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes msgPop {
      from { opacity: 0; transform: translate3d(0, 6px, 0) scale(0.97); }
      to   { opacity: 1; transform: translate3d(0, 0, 0)   scale(1); }
    }
    .btdt-msg.me {
      align-self: flex-end;
      background: linear-gradient(180deg, #f64838 0%, #e03425 100%);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 8px rgba(246, 72, 56, 0.25);
    }
    .btdt-msg.them {
      align-self: flex-start;
      background: #2c2c2e;
      color: #ffffff;
      border-bottom-left-radius: 4px;
      border: 0.5px solid rgba(255, 255, 255, 0.08);
    }
    .ios-typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      background: #2c2c2e;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      align-self: flex-start;
    }
    .ios-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      animation: iosDotBounce 1.25s infinite ease-in-out;
    }
    .ios-dot:nth-child(1) { animation-delay: 0s; }
    .ios-dot:nth-child(2) { animation-delay: 0.2s; }
    .ios-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes iosDotBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    .btdt-msg.me.deleting {
      background: rgba(255, 59, 48, 0.25);
      border: 1px dashed #ff453a;
      color: #ffb4ae;
      text-decoration: line-through;
      animation: msgDeleteVanish 0.44s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes msgDeleteVanish {
      0%   { opacity: 1; transform: translate3d(0,0,0) scale(1); }
      35%  { opacity: 0.9; transform: translate3d(-4px,0,0) scale(0.98); }
      65%  { opacity: 0.65; transform: translate3d(4px,0,0) scale(0.95); }
      100% { opacity: 0; transform: translate3d(0,-6px,0) scale(0.86); }
    }
    .btdt-msg.them { align-self: flex-start; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.13); color: rgba(255,255,255,0.94); border-bottom-left-radius: 5px; }
    .btdt-msg.safety-alert { align-self: stretch; max-width: 100%; background: rgba(246,72,56,0.18); border: 1px solid rgba(255,69,58,0.65); color: #ffd4cf; border-radius: 12px; }
    .id-scan-box {
      border: 1.5px dashed rgba(246, 72, 56, 0.55); border-radius: 14px;
      background: rgba(246, 72, 56, 0.06); padding: 16px; text-align: center; cursor: pointer;
    }
    .id-scan-box.uploaded { border-style: solid; border-color: #4ade80; background: rgba(34, 197, 94, 0.1); }
    .btdt-sheet-backdrop {
      position: fixed; inset: 0; z-index: 8000;
      background: rgba(0, 0, 0, 0.72); backdrop-filter: blur(6px);
      display: none; align-items: flex-end;
    }
    .btdt-sheet-backdrop.visible { display: flex; }
    .btdt-sheet-card {
      width: 100%; max-height: 82%; overflow-y: auto;
      border-top-left-radius: 26px; border-top-right-radius: 26px;
      border-top: 1px solid rgba(255,255,255,0.2);
      background: #0d0606; padding: 16px 16px 32px;
      color: #fff; font-family: var(--btdt-body);
    }
  </style>
</head>
<body>
  <!-- Apple 0.5s OLED Power-On Boot Screen -->
  <div id="appleBootOverlay" class="apple-boot">

      <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>

  <!-- Interactive Dynamic Island Live Activity Capsule (left/right wings clear the 94px center lens) -->
  <div id="dynamicIslandCapsule" class="ios-di-capsule" onclick="onDynamicIslandTap()" title="Dynamic Island">
    <div class="ios-di-content">

        <span style="width:16px;height:16px;border-radius:5px;background:#f64838;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;flex-shrink:0;">B</span>
        <span style="font-size:10.5px;font-weight:700;letter-spacing:-0.02em;">BTDT</span>
      </span>
      <span style="display:inline-flex;align-items:center;gap:5px;max-width:86px;">
        <span id="diText" style="font-size:10.5px;color:rgba(255,255,255,0.86);overflow:hidden;text-overflow:ellipsis;">Ready</span>
        <span id="diBadge" style="width:7px;height:7px;border-radius:50%;background:#30d158;box-shadow:0 0 8px #30d158;flex-shrink:0;"></span>
      </span>

  <!-- Interactive iOS 27 Lock Screen (Swipe up to unlock) -->
  <div id="iosLockScreen" class="ios-lockscreen">
    <div id="lsTorchGlow" class="ls-torch-glow"></div>

      <i id="lsPadlock" class="f7-icons ls-padlock">lock_fill</i>

      <div class="ls-time">9:41</div>
      <div class="ls-widgets">
        <div style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;"><i class="f7-icons" style="font-size:16px;color:#ffd60a;">cloud_sun_fill</i><span>11° Munich</span></div>
        <span style="width:1px;height:16px;background:rgba(255,255,255,0.28);"></span>
        <div style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;"><span style="width:7px;height:7px;border-radius:50%;background:#30d158;"></span><span>28 TUM Peers</span></div>
      </div>
    </div>

    <div style="width:100%;display:flex;flex-direction:column;gap:14px;">
      <div class="ls-notif-card" onclick="unlockAndLaunchBtdt(event)">
        <div style="width:40px;height:40px;border-radius:11px;background:linear-gradient(155deg,#f64838 0%,#99170f 75%,#2b0605 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:0.75px solid rgba(255,255,255,0.3);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5.5 17C7 10 11.8 7 18 7" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/><path d="M10.2 16.5L12.6 18.8L18.2 13.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/><circle cx="5.5" cy="17" r="2.2" fill="#fff"/><circle cx="18" cy="7" r="2.8" fill="#fff"/></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:13.5px;font-weight:600;color:#fff;">BTDT · Aarav Sharma</span>
            <span style="font-size:11px;color:rgba(255,255,255,0.6);">now</span>
          </div>
          <div style="font-size:12.5px;color:rgba(255,255,255,0.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Checked your TUM transcript scan — tap or swipe up</div>
        </div>
      </div>

      <div class="ls-bottom-row">
        <button id="lsTorchBtn" class="ls-quick-btn" onclick="toggleLockTorch(event)" aria-label="Flashlight"><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 2h10v3.2l-2 2.8V20a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V8L7 5.2V2zm5 9.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg></button>
        <div class="ls-swipe-hint" onclick="unlockPhoneOS()">
          <span class="ls-swipe-label">Swipe up to unlock</span>
        </div>
        <button class="ls-quick-btn" onclick="unlockAndLaunchUtility(event, 'camera')" aria-label="Camera"><i class="f7-icons" style="font-size:21px;">camera_fill</i></button>
      </div>
    </div>
  </div>

  <!-- iOS 27 Top Status Bar (Matches Figma node 2971:29538) -->
  <div id="iosStatusBar" class="ios-statusbar">
    <div class="ios-time-wrap"><span class="ios-time">9:41</span></div>

        <span class="ios-bar-pill" style="height:6.33px;"></span>

        <span class="ios-bar-pill" style="height:13.67px;"></span>

  </div>

  <!-- Apple iOS 27 SpringBoard Home Screen (Exact Figma node 12740:33918) -->
  <div id="springBoard" class="springboard">
    <div class="os-icons-canvas">
      <!-- Row 1 -->
      <div class="os-row">
        <button class="os-app-btn" onclick="openUtilityApp('facetime')"><span class="os-icon-frame"><img class="os-icon-img" src="./media/ios27/facetime.png" alt="FaceTime" /></span><span class="os-app-label">FaceTime</span></button>

        <button class="os-app-btn" onclick="openUtilityApp('photos')"><span class="os-icon-frame"><img class="os-icon-img" src="./media/ios27/photos.png" alt="Photos" /></span><span class="os-app-label">Photos</span></button>
        <button class="os-app-btn" onclick="openUtilityApp('camera')"><span class="os-icon-frame"><img class="os-icon-img" src="./media/ios27/camera.png" alt="Camera" /></span><span class="os-app-label">Camera</span></button>
      </div>
      <!-- Row 2 -->
      <div class="os-row">
        <button class="os-app-btn" onclick="openUtilityApp('mail')"><span class="os-icon-frame"><img class="os-icon-img" src="./media/ios27/mail.png" alt="Mail" /><span id="badgeMail" class="ios-badge">2</span></span><span class="os-app-label">Mail</span></button>
        <button class="os-app-btn" onclick="openUtilityApp('clock')"><span class="os-icon-frame"><img class="os-icon-img" src="./media/ios27/clock.png" alt="Clock" /></span><span class="os-app-label">Clock</span></button>
        <button class="os-app-btn" onclick="openUtilityApp('reminders')"><span class="os-icon-frame"><img class="os-icon-img" src="./media/ios27/reminders.png" alt="Reminders" /></span><span class="os-app-label">Reminders</span></button>
        <button class="os-app-btn" onclick="openUtilityApp('maps')"><span class="os-icon-frame"><img class="os-icon-img" src="./media/ios27/maps.png" alt="Maps" /></span><span class="os-app-label">Maps</span></button>
      </div>
      <!-- Row 3 -->
      <div class="os-row">
        <button class="os-app-btn" onclick="openUtilityApp('notes')"><span class="os-icon-frame"><img class="os-icon-img" src="./media/ios27/notes.png" alt="Notes" /></span><span class="os-app-label">Notes</span></button>
        <button class="os-app-btn" onclick="openUtilityApp('calculator')"><span class="os-icon-frame"><img class="os-icon-img" src="./media/ios27/calculator.png" alt="Calculator" /></span><span class="os-app-label">Calculator</span></button>
        <button class="os-app-btn" onclick="openUtilityApp('appstore')"><span class="os-icon-frame"><img class="os-icon-img" src="./media/ios27/appstore.png" alt="App Store" /></span><span class="os-app-label">App Store</span></button>

            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5.5 17C7 10 11.8 7 18 7" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/><path d="M10.2 16.5L12.6 18.8L18.2 13.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/><circle cx="5.5" cy="17" r="2.2" fill="#fff"/><circle cx="18" cy="7" r="2.8" fill="#fff"/></svg>

    <!-- iOS 27 Liquid Glass Search Field -->

        <button class="os-app-btn" onclick="openUtilityApp('safari')"><span class="os-icon-frame"><img class="os-icon-img" src="./media/ios27/safari.png" alt="Safari" /></span></button>

  <!-- BTDT Splash Screen ("Been there, done that") -->
  <div id="btdtSplash" class="btdt-splash" onclick="finishSplashImmediately()">
    <div class="btdt-splash-mark">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none"><path d="M5.5 17C7 10 11.8 7 18 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M10.2 16.5L12.6 18.8L18.2 13.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/><circle cx="5.5" cy="17" r="2.2" fill="#fff"/><circle cx="18" cy="7" r="2.8" fill="#f64838"/></svg>
    </div>
    <p class="btdt-mono" style="color:#f64838;letter-spacing:0.22em;margin:0 0 6px;">BTDT</p>
    <h1 style="font-family:var(--btdt-display);font-size:32px;font-weight:500;letter-spacing:-0.04em;margin:0;">Been there, done that.</h1>
    <p style="font-family:var(--btdt-body);font-size:13.5px;color:rgba(255,255,255,0.68);margin:8px 0 26px;">Trusted students from your home country at campus.</p>
    <div class="preloader color-white" style="width:22px;height:22px;"></div>

  <script src="./peers-data.js?v=20261126af"></script>

        authMode: "signup",
        role: "student",
        studentTab: "home",
        mentorTab: "queue",

        uniId: "tum",

      const f7 = new Framework7({ el: "#app", name: "BTDT", theme: "ios" });
      const statusBar = document.getElementById("iosStatusBar");
      const homeInd = document.getElementById("homeIndicatorBtn");
      const springBoard = document.getElementById("springBoard");

      const btdtSplash = document.getElementById("btdtSplash");
      const sheetBackdrop = document.getElementById("btdtSheet");
      const sheetCard = document.getElementById("btdtSheetCard");
      const bootOverlay = document.getElementById("appleBootOverlay");
      const lockScreen = document.getElementById("iosLockScreen");

      const lsTorchGlow = document.getElementById("lsTorchGlow");
      const lsTorchBtn = document.getElementById("lsTorchBtn");
      let splashTimer = null;
      let bootTimer = null;
      let unlockTimer = null;

      function cancelPendingBootAndUnlock() {
        if (bootTimer) { clearTimeout(bootTimer); bootTimer = null; }
        if (splashTimer) { clearTimeout(splashTimer); splashTimer = null; }
        if (unlockTimer) { clearTimeout(unlockTimer); unlockTimer = null; }
        if (bootOverlay) bootOverlay.classList.add("done");
      }

      window.unlockPhoneOS = function (callback) {
        if (bootTimer) { clearTimeout(bootTimer); bootTimer = null; }
        if (unlockTimer) { clearTimeout(unlockTimer); unlockTimer = null; }
        if (bootOverlay) bootOverlay.classList.add("done");
        if (!state.isLocked) { if (callback) callback(); return; }
        state.isLocked = false;
        if (lsPadlock) lsPadlock.textContent = "lock_open_fill";
        if (lockScreen) {
          lockScreen.classList.remove("dragging");
          lockScreen.style.transform = "";
          lockScreen.style.opacity = "";
          lockScreen.classList.add("unlocked");
        }
        springBoard.classList.remove("locked-behind");
        springBoard.style.transform = "";
        pulseDynamicIsland("Face ID · Unlocked", 1150);
        syncParentInspector();
        if (callback) {
          unlockTimer = setTimeout(() => {
            unlockTimer = null;
            callback();
          }, 190);
        }
      };

      window.unlockAndLaunchBtdt = function (ev) {
        if (ev) ev.stopPropagation();
        window.unlockPhoneOS(() => window.launchBtdtApp("student_app"));
      };

      window.unlockAndLaunchUtility = function (ev, name) {
        if (ev) ev.stopPropagation();
        window.unlockPhoneOS(() => window.openUtilityApp(name));
      };

      window.toggleLockTorch = function (ev) {
        if (ev) ev.stopPropagation();
        state.torchOn = !state.torchOn;
        if (lsTorchGlow) lsTorchGlow.classList.toggle("on", state.torchOn);
        if (lsTorchBtn) {
          lsTorchBtn.classList.toggle("active", state.torchOn);
        }
      };

      window.bootToLockScreen = function (afterBootFn) {
        if (bootTimer) { clearTimeout(bootTimer); bootTimer = null; }
        if (splashTimer) { clearTimeout(splashTimer); splashTimer = null; }
        if (unlockTimer) { clearTimeout(unlockTimer); unlockTimer = null; }
        closeSheet();
        state.isLocked = true;
        state.currentApp = "os_home";
        activeAppShell.classList.remove("visible");
        btdtSplash.classList.remove("visible");
        springBoard.classList.remove("hidden-os");
        springBoard.classList.add("locked-behind");
        setChromeTone(false);

        if (lsPadlock) lsPadlock.textContent = "lock_fill";
        if (lockScreen) {
          lockScreen.classList.remove("unlocked", "dragging");
          lockScreen.style.transform = "";
          lockScreen.style.opacity = "";
        }
        if (bootOverlay) bootOverlay.classList.remove("done");
        syncParentInspector();

        bootTimer = setTimeout(() => {
          bootTimer = null;
          if (bootOverlay) bootOverlay.classList.add("done");
          syncParentInspector();
          if (afterBootFn) setTimeout(afterBootFn, 140);
        }, 500);
      };

      // 144Hz GPU-composited pointer & trackpad swipe-up physics on Lock Screen
      if (lockScreen) {
        let dragging = false;
        let startY = 0;
        let curDy = 0;
        let lastY = 0;
        let lastT = 0;
        let velY = 0;
        let rafPending = false;

        const paintDrag = () => {
          rafPending = false;
          if (!dragging) return;
          const clamped = Math.min(0, Math.max(-420, curDy));
          const prog = Math.min(1, -clamped / 240);
          lockScreen.style.transform = `translate3d(0, ${clamped}px, 0) scale(${(1 - prog * 0.04).toFixed(4)})`;
          lockScreen.style.opacity = String((1 - prog * 0.35).toFixed(3));
          springBoard.style.transform = `translate3d(0, 0, 0) scale(${(0.94 + prog * 0.06).toFixed(4)})`;
        };

        lockScreen.addEventListener("pointerdown", (e) => {
          if (e.target.closest("button") || e.target.closest(".ls-notif-card") || e.target.closest(".ls-swipe-hint")) return;
          dragging = true;
          startY = lastY = e.clientY;
          curDy = 0;
          velY = 0;
          lastT = performance.now();
          lockScreen.classList.add("dragging");
          try { lockScreen.setPointerCapture(e.pointerId); } catch (_) {}
        });

        lockScreen.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const now = performance.now();
          const dt = Math.max(4, now - lastT);
          velY = (e.clientY - lastY) / dt;
          lastY = e.clientY;
          lastT = now;
          curDy = e.clientY - startY;
          if (!rafPending) { rafPending = true; requestAnimationFrame(paintDrag); }
        });

        const endSwipe = () => {
          if (!dragging) return;
          dragging = false;
          lockScreen.classList.remove("dragging");
          if (curDy < -85 || velY < -0.35) {
            window.unlockPhoneOS();
          } else {
            lockScreen.style.transform = "";
            lockScreen.style.opacity = "";
            springBoard.style.transform = "";
          }
        };
        lockScreen.addEventListener("pointerup", endSwipe);
        lockScreen.addEventListener("pointercancel", endSwipe);
        lockScreen.addEventListener("wheel", (e) => {
          if (e.deltaY > 18 && state.isLocked) {
            e.preventDefault();
            window.unlockPhoneOS();
          }
        }, { passive: false });
      }

      function getUniObj() { return S.universities.find((u) => u.id === state.uniId) || S.universities[0]; }
      function getHomeObj() { return S.homeCountries.find((c) => c.iso === state.homeIso) || S.homeCountries[0]; }
      function getRoutePeers() {
        const u = getUniObj();
        const filtered = S.peers.filter((p) => p.homeIso === state.homeIso && p.university === u.name);
        return filtered.length ? filtered : S.peers.filter((p) => p.university === u.name).slice(0, 8);
      }

      function syncParentInspector() {
        const badgeB = document.getElementById("badgeBtdt");
        if (badgeB) { badgeB.textContent = state.unreadBtdt; badgeB.style.display = state.unreadBtdt > 0 ? "flex" : "none"; }
        const badgeM = document.getElementById("badgeMail");
        if (badgeM) { badgeM.textContent = state.unreadMail; badgeM.style.display = state.unreadMail > 0 ? "flex" : "none"; }
        if (window.parent && window.parent !== window) {
          try { window.parent.postMessage({ type: "BTDT_IOS_STATE", state: { ...state, uniName: getUniObj().name } }, "*"); } catch (_) {}
        }
      }

      function setChromeTone(isLightBg) {
        statusBar.classList.toggle("dark-text", !!isLightBg);
        homeInd.classList.toggle("dark-bar", !!isLightBg);
      }

      function setPageHtml(html, lightStatusBar = false) {
        if (lockScreen) lockScreen.classList.add("hidden-os");
        if (bootOverlay) bootOverlay.classList.add("done");
        state.isLocked = false;
        springBoard.classList.add("hidden-os");
        btdtSplash.classList.remove("visible");
        activeAppShell.classList.add("visible");
        setChromeTone(lightStatusBar);
        document.getElementById("mainView").innerHTML = html.replace('<div class="page"', '<div class="page page-current"');
        syncParentInspector();
      }

      window.openSheet = function (innerHtml) {
        sheetCard.innerHTML = `<div style="width:40px;height:4px;border-radius:99px;background:rgba(255,255,255,0.28);margin:0 auto 12px;"></div>` + innerHtml;
        sheetBackdrop.classList.add("visible");
      };
      window.closeSheet = function () { sheetBackdrop.classList.remove("visible"); };

      window.goHomeOS = function () {
        if (state.isLocked) { window.unlockPhoneOS(); return; }
        if (splashTimer) { clearTimeout(splashTimer); splashTimer = null; }
        closeSheet();
        state.currentApp = "os_home";
        activeAppShell.classList.remove("visible");
        btdtSplash.classList.remove("visible");
        springBoard.classList.remove("hidden-os");
        setChromeTone(false);
        syncParentInspector();
      };

      const diCapsule = document.getElementById("dynamicIslandCapsule");
      const diText = document.getElementById("diText");
      let diTimer = null;

      function getReplyMins(p) {
        return p.replyMins || Math.max(9, 107 - (p.metrics?.speed || 95));
      }

      function pulseDynamicIsland(label, holdMs = 1500) {
        if (!diCapsule) return;
        if (diTimer) { clearTimeout(diTimer); diTimer = null; }
        if (diText && label) diText.textContent = label;
        diCapsule.classList.add("expanded");
        statusBar.classList.add("di-expanded");
        if (holdMs > 0) {
          diTimer = setTimeout(() => {
            diCapsule.classList.remove("expanded");
            statusBar.classList.remove("di-expanded");
            diTimer = null;
          }, holdMs);
        }
      }

      window.onDynamicIslandTap = function () {
        if (!diCapsule) return;
        if (diCapsule.classList.contains("expanded")) {
          diCapsule.classList.remove("expanded");
          statusBar.classList.remove("di-expanded");
          if (state.currentApp === "os_home") window.launchBtdtApp();
          else window.goHomeOS();
        } else {
          const msg = state.currentApp === "os_home" ? "Open" : "Live";
          pulseDynamicIsland(msg, 2200);
        }
      };

      window.openSpotlightAlert = function () {
        f7.dialog.prompt("Search iPhone & BTDT campuses:", "Spotlight", (val) => {
          if (!val) return;
          const low = val.toLowerCase();
          const m = S.universities.find((u) => u.name.toLowerCase().includes(low) || u.shortName.toLowerCase().includes(low) || u.city.toLowerCase().includes(low));
          if (m) { state.uniId = m.id; window.launchBtdtApp("student_app"); state.studentTab = "peers"; renderBtdtCurrentStage(); }
          else window.launchBtdtApp("student_app");
        });
      };

      window.setWallpaperMode = function (mode) {
        state.wallpaperMode = mode;
        springBoard.classList.toggle("dark-wallpaper", mode === "dark");
        if (lockScreen) lockScreen.classList.toggle("dark-wallpaper", mode === "dark");
        renderSettings();
      };

      // Stock Utility Apps
      window.openUtilityApp = function (appName) {
        if (splashTimer) { clearTimeout(splashTimer); splashTimer = null; }
        closeSheet();
        state.currentApp = appName;
        if (appName === "calculator") return renderCalculator();
        if (appName === "calendar") return renderCalendar();
        if (appName === "mail") return renderMail();
        if (appName === "notes") return renderNotes();
        if (appName === "settings") return renderSettings();
        if (appName === "weather") {
          const u = getUniObj();
          return setPageHtml(`
            <div class="page" data-name="weather" style="background:linear-gradient(180deg,#1a4887 0%,#2b62aa 60%,#0f2749 100%);color:#fff;">
              <div class="navbar navbar-transparent text-color-white"><div class="navbar-bg" style="background:transparent;"></div><div class="navbar-inner"><div class="left"><a class="link text-color-white" onclick="goHomeOS()"><i class="f7-icons">chevron_left</i><span>Home</span></a></div><div class="title text-color-white">Weather</div></div></div>
              <div class="page-content" style="padding:18px;"><div style="text-align:center;padding-top:16px;"><div style="font-size:30px;">${u.city}</div><div style="font-size:78px;font-weight:200;line-height:1;">11°</div><div style="font-size:16px;opacity:0.9;">Mostly Clear · H:14° L:5°</div></div></div>
            </div>
          `, false);
        }
        if (appName === "wallet") { state.studentTab = "passes"; return window.launchBtdtApp("student_app"); }

        const labels = {
          facetime: ["FaceTime", "Booked video & voice mentor sessions launch inside BTDT Passes."],
          camera: ["Camera", "Scan Student IDs directly inside BTDT Mentor verification."],
          clock: ["Clock", `${getUniObj().city} · Local Campus Time Synced`],
          reminders: ["Reminders", "Pre-arrival reminders sync with your BTDT Arrival Kit."],
          maps: ["Maps", "Campus transit directions open inside BTDT Arrival Kit."],
          appstore: ["App Store", "BTDT 1.0 · Installed & Up to Date"],
          files: ["Files", "Transcript & housing PDFs sync directly to BTDT Chat."],
          translate: ["Translate", "Pair with native-language mentors inside BTDT directly."],
          phone: ["Phone", "Voice & video calls unlock inside confirmed BTDT Passes."],
          safari: ["Safari", "Viewing btdt.app university chapters."],
          messages: ["Messages", "Peer replies appear inside BTDT Chat."],
          photos: ["Photos", "Campus photos & Student ID previews stored locally."]
        };
        const [title, desc] = labels[appName] || ["iPhone", "Installed on iOS 27."];
        f7.dialog.create({ title, text: desc, buttons: [{ text: "Home", onClick: () => goHomeOS() }, { text: "Open BTDT", bold: true, onClick: () => launchBtdtApp() }] }).open();
      };

      window.pressCalc = function (k) {
        const c = state.calc;
        if (k === "AC") { c.display = "0"; c.acc = null; c.op = null; c.resetNext = false; }
        else if (k === "+/-") { if (c.display !== "0") c.display = c.display.startsWith("-") ? c.display.slice(1) : "-" + c.display; }
        else if (k === "%") { c.display = String(Number(c.display) / 100).slice(0, 9); }
        else if (["÷", "×", "-", "+"].includes(k)) { c.acc = Number(c.display); c.op = k; c.resetNext = true; }
        else if (k === "=") {
          if (c.op && c.acc !== null) {
            const cur = Number(c.display);
            let res = c.op === "+" ? c.acc + cur : c.op === "-" ? c.acc - cur : c.op === "×" ? c.acc * cur : cur === 0 ? "Error" : c.acc / cur;
            c.display = typeof res === "number" ? String(Number(res.toFixed(6))).slice(0, 10) : res;
            c.acc = null; c.op = null; c.resetNext = true;
          }
        } else if (k === ".") {
          if (c.resetNext) { c.display = "0."; c.resetNext = false; } else if (!c.display.includes(".")) c.display += ".";
        } else {
          if (c.resetNext || c.display === "0") { c.display = k; c.resetNext = false; } else if (c.display.length < 9) c.display += k;
        }
        renderCalculator();
      };

      function renderCalculator() {
        const c = state.calc;
        const keys = [["AC","fn"],["+/-","fn"],["%","fn"],["÷","op"],["7","n"],["8","n"],["9","n"],["×","op"],["4","n"],["5","n"],["6","n"],["-","op"],["1","n"],["2","n"],["3","n"],["+","op"],["0","zero"],[".","n"],["=","op"]];
        setPageHtml(`<div class="calc-view"><div class="calc-top-bar"><button onclick="goHomeOS()" style="background:none;border:0;color:#ff9f0a;font-size:16px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:3px;"><i class="f7-icons" style="font-size:17px;">chevron_left</i> Home</button><span style="font-size:13px;color:rgba(255,255,255,0.45);">Calculator</span></div><div class="calc-display-wrap"><div class="calc-expr">${c.acc !== null && c.op ? `${c.acc} ${c.op}` : ""}</div><div class="calc-val">${c.display}</div></div><div class="calc-keys">${keys.map(([lbl, kind]) => `<button class="${kind === "zero" ? "calc-btn zero" : kind === "op" ? "calc-btn op" : kind === "fn" ? "calc-btn fn" : "calc-btn"}" onclick="pressCalc('${lbl}')">${lbl}</button>`).join("")}</div></div>`, false);
      }

      window.selectCalDay = function (d) { state.selectedCalDay = d; renderCalendar(); };
      window.addQuickCalEvent = function () {
        f7.dialog.prompt("New reminder on Nov " + state.selectedCalDay + ":", "New Event", (txt) => {
          if (!txt || !txt.trim()) return;
          if (!state.calEvents[state.selectedCalDay]) state.calEvents[state.selectedCalDay] = [];
          state.calEvents[state.selectedCalDay].push({ time: "15:00", title: txt.trim(), sub: "Saved on iPhone", color: "#f64838" });
          renderCalendar();
        });
      };
      function renderCalendar() {
        const d = state.selectedCalDay, evs = state.calEvents[d] || [], days = Array.from({ length: 30 }, (_, i) => i + 1);
        setPageHtml(`
          <div class="page" data-name="calendar">
            <div class="navbar"><div class="navbar-bg"></div><div class="navbar-inner"><div class="left"><a class="link" onclick="goHomeOS()"><i class="f7-icons">chevron_left</i><span>Home</span></a></div><div class="title">November 2026</div><div class="right"><a class="link" onclick="addQuickCalEvent()"><i class="f7-icons" style="color:#ff3b30;">plus</i></a></div></div></div>
            <div class="page-content">
              <div class="block" style="margin-top:12px;background:#fff;border-radius:14px;padding:12px;">
                <div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:600;color:#8e8e93;margin-bottom:8px;"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
                <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">
                  ${days.map((num) => { const isSel = num === d, hasEv = !!(state.calEvents[num]?.length); return `<button onclick="selectCalDay(${num})" style="border:0;height:38px;border-radius:50%;background:${isSel ? "#ff3b30" : "transparent"};color:${isSel ? "#fff" : "#1c1c1e"};font-size:14.5px;font-weight:${isSel ? "600" : "400"};position:relative;cursor:pointer;">${num}${hasEv ? `<span style="position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:${isSel ? "#fff" : "#ff3b30"};"></span>` : ""}</button>`; }).join("")}
                </div>
              </div>
              <div class="block-title">Events · November ${d}</div>
              <div class="list inset strong"><ul>${evs.length ? evs.map((e) => `<li class="item-content"><div class="item-media"><span style="width:4px;height:34px;border-radius:4px;background:${e.color};display:block;"></span></div><div class="item-inner"><div class="item-title"><div class="item-header">${e.time}</div>${e.title}<div class="item-footer">${e.sub}</div></div></div></li>`).join("") : `<li class="item-content"><div class="item-inner"><div class="item-title" style="color:#8e8e93;">No scheduled events.</div></div></li>`}</ul></div>
            </div>
          </div>
        `, true);
      }

      function isContactAttempt(t) {
        if (/\d/.test(t)) return true;
        if (/@/.test(t)) return true;
        if (/[A-Z0-9._%+-]+\s*(?:@|at)\s*[A-Z0-9.-]+\.[A-Z]{2,}/i.test(t)) return true;
        return /\b(whatsapp|whats app|wapp|telegram|tg|insta|instagram|snapchat|snap|signal|imessage|wechat|discord|viber|line|sms|phone|mobile|call me|text me|dm me|reach me|email|mail id|gmail|yahoo|outlook|hotmail|icloud|protonmail|personal contact|personal details|contact details|off platform)\b/i.test(t);
      }

      window.onChatInputLive = function (val) {

      };

      function isGibberishOrUnclear(raw) {
        const clean = raw.trim();
        if (!clean) return true;
        const low = clean.toLowerCase();
        const shortOk = new Set(["hi", "hey", "yo", "ok", "no", "ty", "thx", "sup", "wg", "sim", "id", "fee", "fees", "rent", "dorm", "visa", "job", "jobs", "food", "help", "bye"]);
        const tokens = low.split(/\s+/).filter(Boolean);
        if (tokens.length === 1 && shortOk.has(tokens[0].replace(/[!?.]+$/, ""))) return false;

        const letters = low.replace(/[^a-z]/g, "");
        if (letters.length === 0) return true;
        if (letters.length === 1 && letters !== "i") return true;
        if (/(.)\1{2,}/.test(letters)) return true;
        if (/[bcdfghjklmnpqrstvwxyz]{5,}/.test(letters)) return true;
        const vowels = (letters.match(/[aeiouy]/g) || []).length;
        if (letters.length >= 4 && vowels / letters.length < 0.2) return true;
        if (/^(asdf|qwer|zxcv|jkl|fgh|hjk|bnm|xcv)+$/i.test(letters)) return true;
        return false;
      }

      function buildPeerReply(rawText, peer, uni) {
        const clean = rawText.trim();
        const t = clean.toLowerCase();

        if (isContactAttempt(clean)) {
          return {
            isSafety: true,
            text: `Quick safety reminder: I have to keep everything inside BTDT chat — please don't share phone numbers, WhatsApp, emails, or social handles, and never pay off-platform. BTDT cannot protect against scams outside verified app chat.`,
            receiptTitle: `SAFETY POLICY · STAY ON BTDT`,
            receiptDesc: `Do not share personal contact details or move chats/payments off-platform.`
          };
        }

        if (isGibberishOrUnclear(clean)) {
          state.gibberishCount = (state.gibberishCount || 0) + 1;
          const prompts = [
            `Haha think that slipped out as a keyboard mash! What would you like to know about ${uni.shortName} or settling in ${uni.city}?`,
            `Looks like a typo or test message — feel free to ask me anything real about housing, transcripts, living costs, or classes here.`,
            `Didn't quite catch that! You can ask about campus dorms, rent budget, arrival docs, or day-1 essentials in ${uni.city}.`
          ];
          return { text: prompts[(state.gibberishCount - 1) % prompts.length] };
        }

        if (/^(hi+|hey+|hello+|yo+|hola|namaste|sup|hii+|good morning|good afternoon|good evening)\b[!.\s?]*$/i.test(t)) {
          return { text: `Hi! Good to hear from you. I moved from ${peer.homeCountry} to ${uni.city} for ${peer.program} — what questions do you have about ${uni.shortName}?` };
        }
        if (/\b(how are you|how r u|how's it going|whats up|what's up|how do you do)\b/i.test(t)) {
          return { text: `Doing great, thanks! Just wrapped up campus classes in ${uni.city}. How is your move prep going so far?` };
        }
        if (/\b(who are you|are you a bot|real person|human|ai|chatgpt)\b/i.test(t)) {
          return { text: `I'm ${peer.name}, a ${peer.role} from ${peer.hometown} studying ${peer.program} at ${uni.shortName}. Ask me about ${uni.city} campus life, dorms, or pre-arrival docs anytime!` };
        }
        if (/^(ok|okay|k|cool|great|thanks|thank you|thx|got it|nice|awesome|perfect|bye|see ya)[!.\s]*$/i.test(t)) {
          return { text: `Anytime! Ping me here in verified BTDT chat whenever you need honest details about ${uni.city}.` };
        }
        if (/\b(rent|housing|dorm|wg|room|flat|apartment|stay|hostel|accommodation|scam|deposit|landlord)\b/i.test(t)) {
          return {
            text: `For ${uni.shortName}: ${uni.housing}. Campus residence halls are much cheaper than private flats, though waitlists are real. Watch out for rental scams too — never wire a deposit before seeing the room or verified lease, and keep all advisor chats right here inside BTDT.`,
            receiptTitle: `${uni.shortName} Housing Reality`,
            receiptDesc: uni.housing
          };
        }
        if (/\b(transcript|seal|document|doc|pdf|certificate|notar|marksheet|degree|enroll|aps)\b/i.test(t)) {
          return {
            text: `On ${peer.homeDoc}: keep your registrar seal and official grading scale in one clear PDF scan before arrival so enrollment at ${uni.shortName} goes smoothly.`,
            receiptTitle: `${peer.homeDoc} Note`,
            receiptDesc: "Keep sealed academic scan + grading scale together."
          };
        }
        if (/\b(visa|embassy|passport|consulate|residence permit|permit)\b/i.test(t)) {
          return {
            text: `Just to be clear: BTDT does not provide or process visas — official visa decisions stay solely with the embassy. Seniors like me only help you organize your campus and Week-1 arrival plan.`
          };
        }
        if (/\b(cost|price|fee|fees|budget|euro|€|money|bank|month|spend|expense|blocked|revolut|wise)\b/i.test(t)) {
          return {
            text: `Month-1 budget in ${uni.city} usually covers your security deposit, transit pass, and groceries. Quick text Q&As on BTDT start at €20, or €100 for full pre-arrival document & housing walkthroughs.`
          };
        }
        if (/\b(job|work|werkstudent|part time|part-time|intern|internship|salary|wage|earn)\b/i.test(t)) {
          return {
            text: `Most incoming students from ${peer.homeCountry} at ${uni.shortName} focus on settling into Semester 1 before picking up a campus research assistant or working-student role once local registration is done.`
          };
        }
        if (/\b(class|course|prof|professor|exam|credit|ects|study|lecture|syllabus|hard|difficult)\b/i.test(t)) {
          return {
            text: `Academics in ${peer.program} at ${uni.shortName} move fast compared to home — past exams and study groups make a huge difference in Month 1.`
          };
        }
        if (/\b(food|eat|cook|grocery|indian|halal|veg|vegan|mensa|canteen|language|german|deutsch|sim|phone|transit|bus|train|metro|rail|weather|cold|winter|city)\b/i.test(t)) {
          return {
            text: `In ${uni.city}: ${uni.first14}. Happy to share practical student spots for groceries, student canteens, and getting around in Week 1.`
          };
        }
        return {
          text: `Got it — happy to help with that for ${uni.shortName}! Having moved from ${peer.homeCountry} to ${uni.city}, my biggest tip is sorting campus docs and housing early (${uni.housing.toLowerCase()}). Which part do you want to break down first?`
        };
      }

      window.sendChatReply = function (customText) {
        const inp = document.getElementById("f7ChatInput");
        const txt = customText || (inp ? inp.value.trim() : "");
        if (!txt) return;
        if (inp) inp.value = "";

        if (isContactAttempt(txt)) {
          const tempId = "del_" + Date.now();
          state.chatMessages.push({
            tempId,
            sender: "me deleting",
            text: "Personal contact details removed..."
          });
          state.chatTyping = false;
          pulseDynamicIsland("Deleted · Unsafe", 1700);
          renderBtdtCurrentStage();
          scrollChatToBottom();

          setTimeout(() => {
            state.chatMessages = state.chatMessages.filter((m) => m.tempId !== tempId);
            state.chatMessages.push({
              sender: "safety-alert",
              text: "Warning: Your message was automatically deleted. Do not send personal details here — phone numbers, off-platform messages/handles, and email IDs are strictly blocked.",
              time: "Just now",
              receiptTitle: "MESSAGE AUTO-DELETED · SAFETY GUARD",
              receiptDesc: "Keep all conversations inside verified BTDT chat. BTDT is not responsible for scams or issues off-platform."
            });
            if (state.currentApp === "btdt" && state.btdtStage === "student_app" && state.studentTab === "chat") {
              renderBtdtCurrentStage();
              scrollChatToBottom();
            }
          }, 420);
          return;
        }

        const peer = S.peers.find((p) => p.id === state.activePeerId) || getRoutePeers()[0] || S.peers[0];
        const uni = getUniObj();
        state.chatMessages.push({ sender: "me", text: txt, time: "Just now" });
        state.chatTyping = true;
        renderBtdtCurrentStage();
        scrollChatToBottom();

        setTimeout(() => {
          state.chatTyping = false;
          const replyObj = buildPeerReply(txt, peer, uni);
          state.chatMessages.push({
            sender: replyObj.isSafety ? "safety-alert" : "them",
            text: replyObj.text,
            time: "Just now",
            receiptTitle: replyObj.receiptTitle,
            receiptDesc: replyObj.receiptDesc
          });
          if (state.currentApp === "btdt" && state.btdtStage === "student_app" && state.studentTab === "chat") {
            renderBtdtCurrentStage();
            scrollChatToBottom();
          }
        }, 550);
      };

      function renderBtdtCurrentStage() {
        if (state.btdtStage === "auth") return renderBtdtAuth();
        if (state.btdtStage === "role_gate") return renderBtdtRoleGate();
