              </div>

              <!-- Quick Suggestion Chips -->
              <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;">
                <button onclick="sendChatReply('Hi!')" style="padding:6px 12px;border-radius:999px;border:0.5px solid rgba(255,255,255,0.18);background:#2c2c2e;color:#fff;font-size:11.5px;font-weight:500;white-space:nowrap;cursor:pointer;">Say Hi</button>
                <button onclick="sendChatReply('What are real rent & dorm options near campus?')" style="padding:6px 12px;border-radius:999px;border:0.5px solid rgba(255,255,255,0.18);background:#2c2c2e;color:#fff;font-size:11.5px;font-weight:500;white-space:nowrap;cursor:pointer;">Dorms &amp; rent reality?</button>
                <button onclick="sendChatReply('Does my transcript seal look ready for enrollment?')" style="padding:6px 12px;border-radius:999px;border:0.5px solid rgba(255,255,255,0.18);background:#2c2c2e;color:#fff;font-size:11.5px;font-weight:500;white-space:nowrap;cursor:pointer;">Transcript audit?</button>
                <button onclick="sendChatReply('How do I activate student eSIM & transit pass?')" style="padding:6px 12px;border-radius:999px;border:0.5px solid rgba(255,255,255,0.18);background:#2c2c2e;color:#fff;font-size:11.5px;font-weight:500;white-space:nowrap;cursor:pointer;">eSIM &amp; transit card?</button>
              </div>

              <!-- Anti-Scam Filter Live Warning -->
              <div id="f7ChatLiveWarn" style="display:none;padding:7px 11px;border-radius:10px;border:1px solid #ff453a;background:rgba(255,69,58,0.18);color:#ffb4ae;font-size:11px;font-weight:600;">
                Numbers, emails, and off-platform links are blocked automatically.
              </div>

              <!-- Apple iMessage Input Row -->
              <div style="display:flex;align-items:center;gap:8px;padding-top:2px;">
                <button type="button" style="width:34px;height:34px;border-radius:50%;background:#2c2c2e;border:0.5px solid rgba(255,255,255,0.18);color:#fff;font-size:20px;font-weight:300;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">+</button>
                <input id="f7ChatInput" class="btdt-input" style="margin-top:0;flex:1;border-radius:20px;padding:9px 14px;" type="text" oninput="onChatInputLive(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();sendChatReply();}" placeholder="iMessage · ${activePeer.name.split(" ")[0]}..." />
                <button class="btdt-btn-fill" style="width:34px;height:34px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;" onclick="sendChatReply()">
                  <i class="f7-icons" style="font-size:15px;color:#fff;">arrow_up</i>
                </button>
              </div>
            </div>
          `;
        } else if (tab === "kit") {
          const items = [["esim", "Arrival eSIM & Campus SIM Partner", "Roam from landing, swap on campus day 1"], ["funds", "Student Banking & Proof-of-Funds Prep", "Approved student accounts & living budget notes"], ["health", "Student Health Insurance Activation", "Public & student plan enrollment guide"], ["rail", `${u.city} Semester Transit & City Reg`, "U-Bahn/rail pass + municipal address checklist"]];
          const doneCount = items.filter(([k]) => state.kitDone[k]).length, pct = Math.round((doneCount / items.length) * 100);
          bodyHtml = `
            <div style="display:flex;flex-direction:column;gap:11px;padding-top:12px;">
              <div class="btdt-card">
                <div style="display:flex;justify-content:space-between;margin-bottom:7px;">
                  <span class="btdt-mono" style="color:#f64838;">LANDING READINESS</span>
                  <span class="btdt-mono" style="color:#fff;">${pct}% · ${doneCount}/4 Complete</span>
                </div>
                <div style="height:6px;border-radius:999px;background:rgba(255,255,255,0.1);overflow:hidden;">
                  <div style="height:100%;width:${pct}%;background:#f64838;transition:width 0.25s ease;"></div>
                </div>
              </div>
              ${items.map(([k, title, sub]) => `
                <label class="btdt-card" style="display:flex;align-items:flex-start;gap:11px;cursor:pointer;border-color:${state.kitDone[k] ? "rgba(74,222,128,0.45)" : "rgba(255,255,255,0.13)"};">
                  <input type="checkbox" ${state.kitDone[k] ? "checked" : ""} onchange="toggleKitCheck('${k}')" style="margin-top:3px;accent-color:#f64838;width:17px;height:17px;" />
                  <div>
                    <div style="font-size:13.5px;font-weight:600;color:#fff;${state.kitDone[k] ? "text-decoration:line-through;opacity:0.65;" : ""}">${title}</div>
                    <div style="font-size:11.5px;color:rgba(255,255,255,0.62);margin-top:2px;">${sub}</div>
                  </div>
                </label>
              `).join("")}
              <div class="btdt-card" style="font-size:11.5px;color:rgba(255,255,255,0.7);line-height:1.45;">
                <strong style="color:#fff;">Peer Guidance Policy:</strong> BTDT connects seniors and incoming students for practical arrival &amp; document formatting guidance.
              </div>
            </div>
          `;
        } else {
          // Apple Wallet PKPass Passes
          bodyHtml = `
            <div style="display:flex;flex-direction:column;gap:12px;padding-top:12px;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span class="btdt-mono" style="color:#f64838;">APPLE WALLET BOARDING PASSES</span>
                <button onclick="openBookingSheet('${quickMatch.id}')" style="background:none;border:0;color:#fff;font-family:var(--btdt-mono);font-size:11px;text-decoration:underline;cursor:pointer;">+ New Pass</button>
              </div>

              ${state.passes.map((ps) => {
                const pu = S.universities.find((x) => x.id === ps.uniId) || u, open = state.expandedPass === ps.code;
                return `
                  <div class="btdt-card-accent" style="display:flex;flex-direction:column;gap:11px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                      <span class="btdt-mono" style="color:#f64838;font-size:11px;">PASS ${ps.code}</span>
                      <span class="btdt-pill ${ps.status === "Confirmed" ? "btdt-pill-green" : ""}">${ps.status}</span>
                    </div>

                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                      <div style="display:flex;align-items:center;gap:10px;min-width:0;">
                        <img src="./media/unis/${pu.id}.svg" class="uni-logo-pill" alt="${pu.shortName}" />
                        <div style="min-width:0;">
                          <div style="font-size:14.5px;font-weight:600;color:#fff;">${ps.mentorName}</div>
                          <div style="font-size:11.5px;color:rgba(255,255,255,0.65);font-family:${pu.font || "inherit"};">${pu.shortName} · ${ps.pkg}</div>
                        </div>
                      </div>
                      <strong class="btdt-mono" style="font-size:16px;color:#fff;">€${ps.total}</strong>
                    </div>

                    <div style="border-top:1px dashed rgba(255,255,255,0.22);margin:4px 0;"></div>

                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;">
                      <span style="color:rgba(255,255,255,0.65);">${ps.when}</span>
                      <button onclick="togglePassExpand('${ps.code}')" style="background:none;border:0;color:#f64838;text-decoration:underline;cursor:pointer;font-size:11.5px;font-family:var(--btdt-mono);">
                        ${open ? "Hide Receipts" : `Receipts (${ps.notes.length})`}
                      </button>
                    </div>

                    ${open ? `
                      <div style="display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.1);">
                        ${ps.notes.map((nt) => `
                          <div style="padding:8px 10px;border-radius:8px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.12);font-size:11.5px;color:rgba(255,255,255,0.88);">
                            ✓ ${nt}
                          </div>
                        `).join("")}
                      </div>
                    ` : ""}
                  </div>
                `;
              }).join("")}
            </div>
          `;
        }

        const tabs = [["home", "house_fill", "Home"], ["peers", "person_2_fill", "Peers"], ["chat", "chat_bubble_2_fill", "Chat"], ["kit", "briefcase_fill", "Kit"], ["passes", "ticket_fill", "Passes"]];
        setPageHtml(`
          <div class="page btdt-app-page" data-name="student-app">
            <div class="navbar">
              <div class="navbar-bg"></div>
              <div class="navbar-inner">
                <div class="left">
                  <a class="link" onclick="goHomeOS()" style="color:#f64838;font-size:13px;display:flex;align-items:center;gap:3px;">
                    <i class="f7-icons" style="font-size:15px;">chevron_left</i>Home
                  </a>
                </div>
                <div class="title" style="margin:0 auto;">
                  <div class="ios-role-pill">
                    <button class="active">Student</button>
                    <button onclick="switchToMentorWorkspace()">Mentor</button>
                  </div>
                </div>
                <div class="right">
                  <a class="link" onclick="btdtBack('student_onboard')" style="color:rgba(255,255,255,0.65);font-size:12px;">Route</a>
                </div>
              </div>
            </div>
            <div class="toolbar toolbar-bottom tabbar tabbar-icons">
              <div class="toolbar-inner">
                ${tabs.map(([id, ic, lbl]) => `
                  <a class="tab-link ${tab === id ? "tab-link-active" : ""}" onclick="switchStudentTab('${id}')" style="cursor:pointer;position:relative;">
                    <i class="f7-icons">${ic}</i>
                    <span class="tabbar-label">${lbl}</span>
                    ${id === "chat" ? `<span style="position:absolute;top:6px;right:25%;width:7px;height:7px;border-radius:50%;background:#ff3b30;border:1.5px solid #1c1c1e;"></span>` : ""}
                  </a>
                `).join("")}
              </div>
            </div>
            <div class="page-content">${bodyHtml}</div>
          </div>
        `, false);
      }

      function renderMentorApp() {
        const u = getUniObj(), tab = state.mentorTab;
        let bodyHtml = "";
        if (tab === "queue") {
          bodyHtml = `
            <div style="display:flex;flex-direction:column;gap:11px;padding-top:12px;">
              <div class="btdt-card-accent">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                  <img src="./media/unis/${u.id}.svg" class="uni-logo-pill" alt="${u.shortName}" />
                  <span class="btdt-pill" style="background:#f64838;color:#fff;">MENTOR STUDIO</span>
                </div>
                <div style="font-family:var(--btdt-display);font-size:15px;font-weight:600;color:#fff;">${state.mentorEduEmail}</div>
                <div class="btdt-mono" style="color:${state.mentorIdUploaded ? "#4ade80" : "rgba(255,255,255,0.72)"};margin-top:3px;">
                  Student ID Check: ${state.mentorIdUploaded ? "✓ Verified Preview Staged" : "Pending ID Upload"}
                </div>
              </div>
              ${state.mentorQueue.map((req) => `
                <div class="btdt-card" style="display:flex;flex-direction:column;gap:7px;">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                    <div>
                      <div style="font-size:14px;font-weight:600;color:#fff;">${req.name}</div>
                      <div class="btdt-mono" style="color:rgba(255,255,255,0.55);">${req.route}</div>
                    </div>
                    <strong class="btdt-mono" style="color:#f64838;">${req.tier}</strong>
                  </div>
                  <p style="font-size:12px;color:rgba(255,255,255,0.8);margin:0;">“${req.topic}”</p>
                  <div style="display:flex;gap:8px;padding-top:4px;">
                    ${req.status === "pending" ? `
                      <button class="btdt-btn-fill" style="padding:7px;font-size:11.5px;" onclick="handleMentorReq('${req.id}','accepted')">Accept Request</button>
                      <button class="btdt-btn-outline" style="padding:7px;font-size:11.5px;" onclick="handleMentorReq('${req.id}','declined')">Decline</button>
                    ` : `<span class="btdt-pill ${req.status === "accepted" ? "btdt-pill-green" : ""}">${req.status}</span>`}
                  </div>
                </div>
              `).join("")}
            </div>
          `;
        } else if (tab === "chats") {
          bodyHtml = `
            <div style="display:flex;flex-direction:column;gap:10px;padding-top:12px;">
              <div class="btdt-mono" style="color:#f64838;">MENTEE CONVERSATIONS</div>
              <div class="btdt-card" style="display:flex;gap:10px;align-items:center;">
                <img src="./media/avatar-3.jpg" style="width:40px;height:40px;border-radius:50%;object-fit:cover;" />
                <div>
                  <div style="font-size:13.5px;font-weight:600;color:#fff;">Priya Deshmukh</div>
                  <div style="font-size:11.5px;color:rgba(255,255,255,0.68);">“Can I share my transcript format draft?”</div>
                </div>
              </div>
              <div class="btdt-card" style="display:flex;gap:10px;align-items:center;">
                <img src="./media/avatar-5.jpg" style="width:40px;height:40px;border-radius:50%;object-fit:cover;" />
                <div>
                  <div style="font-size:13.5px;font-weight:600;color:#fff;">Karthik Nair</div>
                  <div style="font-size:11.5px;color:rgba(255,255,255,0.68);">“Which dorm hall is closest to campus?”</div>
                </div>
              </div>
            </div>
          `;
        } else if (tab === "sessions") {
          bodyHtml = `
            <div style="display:flex;flex-direction:column;gap:10px;padding-top:12px;">
              <div class="btdt-card-accent">
                <div class="btdt-mono" style="color:#f64838;">COMPLETED SESSIONS</div>
                <div style="font-family:var(--btdt-display);font-size:32px;font-weight:600;color:#fff;margin:2px 0;">€460.00</div>
                <div style="font-size:11.5px;color:rgba(255,255,255,0.68);">24 students mentored · ${u.shortName}</div>
              </div>
              ${state.passes.map((ps) => `
                <div class="btdt-card" style="display:flex;justify-content:space-between;align-items:center;">
                  <div>
                    <div style="font-size:13px;font-weight:600;">${ps.code} · ${ps.pkg}</div>
                    <div style="font-size:11px;color:rgba(255,255,255,0.58);">${ps.status}</div>
                  </div>
                  <strong class="btdt-mono">€${ps.total}</strong>
                </div>
              `).join("")}
            </div>
          `;
        } else if (tab === "hours") {
          bodyHtml = `
            <div style="display:flex;flex-direction:column;gap:10px;padding-top:12px;">
              <div class="btdt-mono" style="color:#f64838;">AVAILABILITY &amp; PICKUP TOGGLES</div>
              ${[["monThu", "Mon–Thu Evenings (18:00–21:00)", "Text & quick calls open"], ["friSat", "Fri–Sat Deep-Dive Slots", "60-min paperwork prep"], ["arrivalGreet", "Airport Meet & Greet (+€40)", "Student covers transit fares"]].map(([k, t, s]) => `
                <label class="btdt-card" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
                  <div>
                    <div style="font-size:13px;font-weight:600;">${t}</div>
                    <div style="font-size:11px;color:rgba(255,255,255,0.6);">${s}</div>
                  </div>
                  <input type="checkbox" ${state.availability[k] ? "checked" : ""} onchange="toggleAvail('${k}')" style="width:18px;height:18px;accent-color:#f64838;" />
                </label>
              `).join("")}
            </div>
          `;
        } else {
          bodyHtml = `
            <div class="btdt-card" style="text-align:center;margin-top:12px;padding:20px;">
              <div class="btdt-mono" style="color:#f64838;">PUBLIC AURA RATING</div>
              <div style="font-family:var(--btdt-display);font-size:48px;font-weight:600;color:#fff;line-height:1.1;margin:8px 0;">99<span style="font-size:20px;color:#f64838;">/100</span></div>
              <div style="font-size:12.5px;color:rgba(255,255,255,0.75);">24 Verified Sessions · 0 Negative Reviews · ~14m Reply</div>
            </div>
          `;
        }

        const mTabs = [["queue", "tray_full_fill", "Queue"], ["chats", "chat_bubble_2_fill", "Chats"], ["sessions", "calendar_today", "Sessions"], ["hours", "clock_fill", "Hours"], ["aura", "rosette", "Aura"]];
        setPageHtml(`
          <div class="page btdt-app-page" data-name="mentor-app">
            <div class="navbar">
              <div class="navbar-bg"></div>
              <div class="navbar-inner">
                <div class="left">
                  <a class="link" onclick="goHomeOS()" style="color:#f64838;font-size:13px;display:flex;align-items:center;gap:3px;">
                    <i class="f7-icons" style="font-size:15px;">chevron_left</i>Home
                  </a>
                </div>
                <div class="title" style="margin:0 auto;">
                  <div class="ios-role-pill">
                    <button onclick="switchToStudentWorkspace()">Student</button>
                    <button class="active">Mentor</button>
                  </div>
                </div>
                <div class="right">
                  <a class="link" onclick="btdtBack('mentor_verify')" style="color:rgba(255,255,255,0.65);font-size:12px;">Verify</a>
                </div>
              </div>
            </div>
            <div class="toolbar toolbar-bottom tabbar tabbar-icons">
              <div class="toolbar-inner">
                ${mTabs.map(([id, ic, lbl]) => `
                  <a class="tab-link ${tab === id ? "tab-link-active" : ""}" onclick="switchMentorTab('${id}')" style="cursor:pointer;">
                    <i class="f7-icons">${ic}</i>
                    <span class="tabbar-label">${lbl}</span>
                  </a>
                `).join("")}
              </div>
            </div>
            <div class="page-content">${bodyHtml}</div>
          </div>
        `, false);
      }

      window.switchToStudentWorkspace = function() {
        state.role = "student";
        state.btdtStage = "student_app";
        state.studentTab = "home";
        state.currentApp = "btdt";
        renderBtdtCurrentStage();
      };
      window.switchToMentorWorkspace = function() {
        state.role = "mentor";
        state.btdtStage = "mentor_app";
        state.mentorTab = "queue";
        state.currentApp = "btdt";
        renderBtdtCurrentStage();
      };

      window.BTDT_IOS = {
        bootToLockScreen: () => window.bootToLockScreen(),
        bootAndOpen: (screen) => {
          window.bootToLockScreen(() => {
            window.unlockPhoneOS(() => {
              if (screen === "chat") window.BTDT_IOS.openStudentScreen("chat");
              else if (screen === "arrival" || screen === "kit") window.BTDT_IOS.openStudentScreen("kit");
              else if (screen === "wallet" || screen === "passes") window.BTDT_IOS.openStudentScreen("passes");
              else if (screen === "auth") window.launchBtdtApp("auth");
              else if (screen === "mentor") window.BTDT_IOS.openMentorScreen("queue");
              else window.BTDT_IOS.openStudentScreen("home");
            });
          });
        },
        unlock: () => window.unlockPhoneOS(),
        goHome: () => { window.unlockPhoneOS(); window.goHomeOS(); },
        launchBtdt: () => { window.unlockPhoneOS(); window.launchBtdtApp(); },
        openAuth: () => { window.unlockPhoneOS(); window.launchBtdtApp("auth"); },
        openStudentScreen: (tab = "home") => {
          cancelPendingBootAndUnlock();
          state.isLocked = false;
          if (lockScreen) lockScreen.classList.add("hidden-os");
          if (bootOverlay) bootOverlay.classList.add("done");
          if (btdtSplash) btdtSplash.classList.remove("visible");
          if (activeAppShell) activeAppShell.classList.add("visible");
          const map = { home: "home", peers: "peers", chat: "chat", arrival: "kit", kit: "kit", wallet: "passes", passes: "passes" };
          state.role = "student";
          state.btdtStage = "student_app";
          state.studentTab = map[tab] || "home";
          state.currentApp = "btdt";
          renderBtdtCurrentStage();
        },
        openMentorScreen: (tab = "queue") => {
          cancelPendingBootAndUnlock();
          state.isLocked = false;
          if (lockScreen) lockScreen.classList.add("hidden-os");
          if (bootOverlay) bootOverlay.classList.add("done");
          if (btdtSplash) btdtSplash.classList.remove("visible");
          if (activeAppShell) activeAppShell.classList.add("visible");
          state.role = "mentor";
          state.btdtStage = "mentor_app";
          state.mentorTab = tab;
          state.currentApp = "btdt";
          renderBtdtCurrentStage();
        },
        openUtilityApp: (name) => { cancelPendingBootAndUnlock(); window.unlockPhoneOS(); window.openUtilityApp(name); },
        getState: () => ({ ...state, uniName: getUniObj().name })
      };

      syncParentInspector();
      window.bootToLockScreen();
    })();
  </script>
</body>
</html>
